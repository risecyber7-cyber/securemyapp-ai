[project]
name = "securemyapp-ai-backend"
version = "0.1.0"
description = "Application layer for SecureMyApp AI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "redis>=5.2.0",
  "celery>=5.4.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.2.0",
  "bcrypt>=4.2.1",
  "httpx>=0.27.2",
  "playwright>=1.48.0",
  "python-Wappalyzer>=0.3.1",
  "boto3>=1.35.66",
  "openai>=1.51.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
