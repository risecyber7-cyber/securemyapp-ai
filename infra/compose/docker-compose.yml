version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      SECUREMYAPP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/securemyapp
      SECUREMYAPP_REDIS_URL: redis://redis:6379/0
      SECUREMYAPP_BROKER_URL: redis://redis:6379/1
      SECUREMYAPP_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A backend.app.workers.tasks worker --loglevel=info
    environment:
      SECUREMYAPP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/securemyapp
      SECUREMYAPP_REDIS_URL: redis://redis:6379/0
      SECUREMYAPP_BROKER_URL: redis://redis:6379/1
      SECUREMYAPP_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - backend
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: securemyapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  minio_data:
